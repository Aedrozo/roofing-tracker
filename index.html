<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next Gen Premier Roofing — Job Tracker</title>
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1216">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <img id="brand-logo" src="assets/logo.png" alt="Next Gen Premier Roofing Contractor logo">
      <div class="brand-name">
        <strong id="brand-title">Next Gen</strong>
        <span id="brand-sub">Premier Roofing Contractor</span>
      </div>
    </div>
    <nav class="nav" aria-label="Main">
      <button class="nav-btn active" data-action="nav" data-view="dashboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z"/></svg>
        Dashboard
      </button>
      <button class="nav-btn" data-action="nav" data-view="jobs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4h4a2 2 0 0 1 2 2v1h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3V6a2 2 0 0 1 2-2Zm0 3h4V6h-4v1Z"/></svg>
        Jobs
      </button>
      <button class="nav-btn" data-action="nav" data-view="scopes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6a1 1 0 0 1 1 1v1h3a1 1 0 0 1 1 1v17a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3V3a1 1 0 0 1 1-1Zm1 3h4V4h-4v1Zm-2.3 8.3 2.3 2.3 4.3-4.3 1.4 1.4-5.7 5.7-3.7-3.7 1.4-1.4Z"/></svg>
        Scope of Work
      </button>
      <button class="nav-btn" data-action="nav" data-view="customers">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0 2c-4.2 0-7 2.1-7 4.7V20h14v-2.3c0-2.6-2.8-4.7-7-4.7Zm8-2.4a3.3 3.3 0 1 0-2.4-5.6 5.9 5.9 0 0 1 .4 5.5c.6.07 1.3.1 2 .1ZM17.6 13c-.5 0-1 .05-1.5.14A6 6 0 0 1 18 17.7V20h4v-2.3c0-2.6-1.9-4.7-4.4-4.7Z"/></svg>
        Customers
      </button>
      <button class="nav-btn" data-action="nav" data-view="employees">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14a8 8 0 0 1 5-7.42V11h2V6h2v5h2V6.58A8 8 0 0 1 20 14v1H4v-1Zm-1 3h18v2.5a.5.5 0 0 1-.5.5h-17a.5.5 0 0 1-.5-.5V17Z"/></svg>
        Employees
      </button>
      <button class="nav-btn" data-action="nav" data-view="schedule">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h2v2h6V2h2v2h3a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3V2Zm14 8H3v10h18V10Zm-11 3v2H7v-2h3Zm4 0v2h-3v-2h3Zm4 0v2h-3v-2h3Z"/></svg>
        Schedule
      </button>
      <button class="nav-btn" data-action="nav" data-view="pricing">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10a2 2 0 0 1 2 2v16l-7-3-7 3V5a2 2 0 0 1 2-2Zm2 5h6V6H9v2Zm0 4h6v-2H9v2Z"/></svg>
        Pricing Sheet
      </button>
      <button class="nav-btn" data-action="nav" data-view="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8Zm9 4c0 .6-.06 1.17-.16 1.73l2 1.55-2 3.44-2.35-.95c-.87.73-1.88 1.3-3 1.65L15 22H9l-.49-2.58a8.9 8.9 0 0 1-3-1.65l-2.35.95-2-3.44 2-1.55A9.3 9.3 0 0 1 3 12c0-.6.06-1.17.16-1.73l-2-1.55 2-3.44 2.35.95c.87-.73 1.88-1.3 3-1.65L9 2h6l.49 2.58c1.12.35 2.13.92 3 1.65l2.35-.95 2 3.44-2 1.55c.1.56.16 1.13.16 1.73Z"/></svg>
        Settings
      </button>
    </nav>
    <div class="sidebar-foot">
      <p>All data is saved privately in this browser. Back it up any time from <button class="linklike" data-action="nav" data-view="settings">Settings</button>.</p>
    </div>
  </aside>

  <main class="main">
    <section id="view-dashboard" class="view active" aria-label="Dashboard"></section>
    <section id="view-jobs" class="view" aria-label="Jobs"></section>
    <section id="view-scopes" class="view" aria-label="Scope of work forms"></section>
    <section id="view-customers" class="view" aria-label="Customers"></section>
    <section id="view-employees" class="view" aria-label="Employees"></section>
    <section id="view-schedule" class="view" aria-label="Schedule"></section>
    <section id="view-pricing" class="view" aria-label="Pricing sheet"></section>
    <section id="view-settings" class="view" aria-label="Settings"></section>
  </main>
</div>

<dialog id="job-dialog" aria-label="Job details"></dialog>
<dialog id="customer-dialog" aria-label="Customer details"></dialog>
<dialog id="employee-dialog" aria-label="Employee details"></dialog>
<div id="invoice-overlay" hidden></div>
<div id="chart-tooltip" class="chart-tooltip" role="status" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="js/core.js"></script>
<script src="js/views.js"></script>
<script src="js/main.js"></script>
</body>
</html>
